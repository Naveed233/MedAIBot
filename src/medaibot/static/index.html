<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAIBot</title>
<style>
  /* Mulberry and gold on white. Gold is too light for text on white, so it is only used for rules and focus. */
  :root { --bg: #ffffff; --fg: #2d2a2c; --muted: #6e666b; --card: #ffffff; --line: #e8dfe4; --brand: #830051; --gold: #f0ab00;
          --accent: #830051; --btn: #830051; --btn-hover: #66003f; --on-btn: #ffffff; --ok: #2e7d4f; --warn: #9a5b00; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171315; --fg: #f1ebee; --muted: #b3a8ae; --card: #211b1e; --line: #3b3036; --brand: #6e0045;
            --accent: #ef9fcb; --btn: #a3216b; --btn-hover: #b8357f; --ok: #7cc79b; --warn: #f0b84d; --bad: #f08a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  .band { background: var(--brand); color: #ffffff; border-bottom: 4px solid var(--gold); }
  .band .inner { max-width: 860px; margin: 0 auto; padding: 20px 16px 16px; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .01em; }
  .sub { color: #f3e3ec; margin: 0; font-size: 13px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  input { min-width: 0; }
  input:focus { border-color: var(--accent); }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--btn); color: var(--on-btn, #ffffff); font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .5; cursor: wait; }
  .examples { margin: 10px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; font-size: 13px; }
  .examples button:hover { background: transparent; border-color: var(--accent); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin: 0 0 10px; }
  .answer { font-size: 16px; }
  .abstain { color: var(--warn); }
  sup a { color: var(--accent); text-decoration: none; margin-left: 2px; }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 8px; }
  .meta { color: var(--muted); font-size: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .partial { color: var(--warn); }
  code { font-size: 12px; overflow-wrap: anywhere; }
  .why { color: var(--muted); font-style: italic; }
  .error { color: var(--bad); }
  .codebox { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .codebox input { max-width: 240px; padding: 6px 10px; }
  .codebox[hidden] { display: none; }
  .codewrap { position: relative; display: inline-flex; align-items: center; }
  .codewrap input { padding-right: 36px; }
  button.eye { position: absolute; right: 4px; padding: 4px; border: 0; background: transparent; color: var(--muted); line-height: 0; }
  button.eye:hover:not(:disabled) { background: transparent; color: var(--accent); }
  button.link { background: transparent; color: var(--accent); border: 0; padding: 0; font-size: 13px; text-decoration: underline; }
  button.link:hover:not(:disabled) { background: transparent; }
  .readas { margin: 0 0 8px; }
</style>
</head>
<body>
<header class="band"><div class="inner">
  <h1>MedAIBot</h1>
  <p class="sub">Cited answers from five US FDA drug labels, with the agent's tool trace and grounding checks. Demo project: not medical advice, not affiliated with or endorsed by AstraZeneca. US labels differ from Japanese PMDA labels.</p>
</div></header>
<main>
  <div class="codebox" id="codebox" hidden>
    <label for="code">Access code</label>
    <span class="codewrap">
      <input id="code" type="password" autocomplete="off" placeholder="from the person who shared this link">
      <button type="button" id="showcode" class="eye"></button>
    </span>
  </div>
  <form id="ask">
    <input id="q" name="q" autocomplete="off" placeholder="Ask about TAGRISSO, LYNPARZA, FARXIGA, IMFINZI or CALQUENCE" required maxlength="1000">
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="examples" id="examples"></div>
  <div id="out"></div>
</main>
<script>
const EXAMPLES = [
  "What are the contraindications for TAGRISSO?",
  "タグリッソの用量は？",
  "Does TAGRISSO interact with grapefruit juice?",
  "What is the IMFINZI dose for metastatic NSCLC in patients weighing 30 kg or more?",
  "Is the FARXIGA label in your index the latest version?",
];
const $ = (id) => document.getElementById(id);
const FIRST_PROMPT = "Ask about TAGRISSO, LYNPARZA, FARXIGA, IMFINZI or CALQUENCE";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

for (const e of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = e;
  b.onclick = () => { $("q").value = e; ask(); };
  $("examples").appendChild(b);
}
$("ask").onsubmit = (ev) => { ev.preventDefault(); ask(); };

// The hosted demo asks for a shared access code. A link can carry it as #code=..., which the
// browser never sends to the server. The code is remembered in this browser only.
const store = { get() { try { return localStorage.getItem("medaibot-code") || ""; } catch { return ""; } },
                set(v) { try { localStorage.setItem("medaibot-code", v); } catch {} } };
function codeFromLink() {
  const fromLink = new URLSearchParams(location.hash.slice(1)).get("code");
  if (fromLink) { store.set(fromLink); history.replaceState(null, "", location.pathname); }
  $("code").value = store.get();
}
codeFromLink();
window.addEventListener("hashchange", codeFromLink);
$("code").onchange = () => store.set($("code").value.trim());
// One eye button shows the typed code and hides it again.
const EYE_PATH = `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>`;
const eyeIcon = (slashed) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${EYE_PATH}${slashed ? `<line x1="3" y1="3" x2="21" y2="21"/>` : ""}</svg>`;
function showCode(visible) {
  const label = visible ? "Hide access code" : "Show access code";
  $("code").type = visible ? "text" : "password";
  $("showcode").innerHTML = eyeIcon(visible);
  $("showcode").title = label;
  $("showcode").setAttribute("aria-label", label);
  $("showcode").setAttribute("aria-pressed", String(visible));
}
showCode(false);
$("showcode").onclick = () => showCode($("code").type === "password");
// Earlier turns of this conversation, oldest first. The server uses the last three to read a
// follow-up ("Which of those are serious?"); they are never used as evidence.
let convo = [];

// The page talks to the server it was loaded from, so it does nothing useful when opened as a file.
const served = location.protocol === "http:" || location.protocol === "https:";
const notServed = `<section><p class="error">This page needs the MedAIBot server. Start it with <code>uv run medaibot serve</code> and open http://127.0.0.1:8000.</p></section>`;
if (!served) $("out").innerHTML = notServed;
else fetch("/ready").then((r) => r.json()).then((ready) => { if (ready.access_code_required) $("codebox").hidden = false; }).catch(() => {});

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;
  if (!served) { $("out").innerHTML = notServed; return; }
  $("go").disabled = true;
  $("out").innerHTML = `<section><p class="meta">Working...</p></section>`;
  try {
    const headers = { "content-type": "application/json", "x-access-code": $("code").value.trim() };
    const r = await fetch("/ask", { method: "POST", headers, body: JSON.stringify({ question, history: convo.slice(-3) }) });
    const body = await r.json();
    if (r.status === 401) { $("codebox").hidden = false; $("code").focus(); }
    if (!r.ok) { $("out").innerHTML = `<section><p class="error">${r.status === 429 ? "" : `HTTP ${r.status}: `}${esc(body.detail)}</p></section>`; return; }
    render(body);
    convo.push({ question: body.asked_as || body.question, answer: String(body.answer || "").slice(0, 1500) });
    $("q").value = "";
    $("q").placeholder = "Ask a follow-up, or a new question";
  } catch (err) {
    $("out").innerHTML = `<section><p class="error">${esc(err)}</p></section>`;
  } finally {
    $("go").disabled = false;
  }
}

function render(a) {
  const num = Object.fromEntries(a.citations.map((c, i) => [c.chunk_id, i + 1]));
  const answer = a.abstained
    ? `<p class="answer abstain">Abstained: ${esc(a.abstain_reason)}</p>`
    : a.sentences.map((s) => `<span>${esc(s.text)}${s.citations.filter((c) => num[c]).map((c) => `<sup><a href="#src-${num[c]}">[${num[c]}]</a></sup>`).join("")}</span>`).join(" ");
  const sources = a.citations.map((c, i) => `<li id="src-${i + 1}"><strong>${esc(c.drug)}</strong> · ${esc(c.section_title)}${c.subsection ? " › " + esc(c.subsection) : ""}
      <div class="meta">label v${esc(c.label_version)} (${esc(c.effective_time)}) · <code>${esc(c.chunk_id)}</code> · <a href="${esc(c.source_url)}" target="_blank" rel="noopener">DailyMed</a></div>
      <div class="meta">${esc(c.quote)}…</div></li>`).join("");
  const g = a.grounding;
  const checks = g ? `<p>Deterministic checks: <strong class="${g.passed ? "ok" : "bad"}">${g.passed ? "passed" : "failed"}</strong> · mean token support ${g.mean_token_support.toFixed(2)}${g.judge_model ? ` · judge: ${esc(g.judge_model)} (heuristic)` : ""}</p>
      <ol>${g.sentences.map((s) => `<li>support ${s.token_support.toFixed(2)}${s.unsupported_numbers.length ? ` · <span class="bad">numbers not in source: ${esc(s.unsupported_numbers.join(", "))}</span>` : ""}${s.judge_label !== "not_checked" ? ` · judge <span class="${s.judge_label === "supported" ? "ok" : s.judge_label === "partial" ? "partial" : "bad"}">${esc(s.judge_label)}</span>${s.judge_reason ? ` <span class="meta">${esc(s.judge_reason)}</span>` : ""}` : ""}</li>`).join("")}</ol>
      ${g.problems.length ? `<p class="meta">${g.problems.map(esc).join("<br>")}</p>` : ""}` : `<p class="meta">No answer to check.</p>`;
  const trace = a.trace.map((t) => {
    const args = Object.entries(t.arguments).filter(([k]) => k !== "reason").map(([k, v]) => `${esc(k)}=${esc(JSON.stringify(v))}`).join(", ");
    return `<li><strong>${esc(t.kind)}</strong>${t.name ? ` <code>${esc(t.name)}(${args})</code>` : ""} <span class="meta">${t.duration_ms ? t.duration_ms.toFixed(0) + " ms" : ""}</span>
      ${t.arguments.reason ? `<div class="why">why: ${esc(t.arguments.reason)}</div>` : ""}
      <div class="meta">→ ${esc(t.summary)}</div>${t.flags.length ? `<div class="bad">flags: ${esc(t.flags.join(", "))}</div>` : ""}</li>`;
  }).join("");
  const earlier = convo.length ? `<section><h2>Earlier in this conversation</h2><ol>${convo.map((t) => `<li class="meta">${esc(t.question)}</li>`).join("")}</ol>
      <button type="button" class="link" id="newchat">Start a new conversation</button></section>` : "";
  const readAs = a.asked_as ? `<p class="meta readas">Read as: ${esc(a.asked_as)}</p>` : "";
  $("out").innerHTML = `
    ${earlier}
    <section><h2>Answer</h2>${readAs}<div class="answer">${answer}</div></section>
    ${a.citations.length ? `<section><h2>Sources</h2><ol>${sources}</ol></section>` : ""}
    <section><h2>Checks</h2>${checks}</section>
    <section><h2>Agent trace · ${esc(a.provider)} · ${a.latency_ms.toFixed(0)} ms</h2><ol>${trace}</ol></section>
    <p class="meta">${esc(a.disclaimer)}</p>`;
  if ($("newchat")) $("newchat").onclick = () => { convo = []; $("out").innerHTML = ""; $("q").placeholder = FIRST_PROMPT; $("q").focus(); };
}
</script>
</body>
</html>
