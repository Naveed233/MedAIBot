[project]
name = "medaibot"
version = "0.1.0"
description = "Cited question answering over FDA drug labels: hybrid retrieval, a bounded tool-calling agent, grounding checks and an evaluation harness."
readme = "README.md"
authors = [
    { name = "Naveed Maqbool", email = "naweed23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
medaibot = "medaibot:main"

[project.optional-dependencies]
openai = [
    "openai>=3.41.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ISC", "RUF"]
# Japanese text in code and tests uses full-width punctuation on purpose.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
